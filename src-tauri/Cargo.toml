[package]
name = "app"
version = "0.2.0"
description = "Spotlight for Windows - fast, beautiful, free universal launcher"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"

# Search / ranking
fuzzy-matcher = "0.3"
rayon = "1"

# File index
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
walkdir = "2"
notify = "6"
notify-debouncer-mini = "0.4"

# Calculator provider
meval = "0.2"

# Misc
dirs = "5"
once_cell = "1"
open = "5"
arboard = "3"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.5"
windows-icons = "0.3"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Management_Deployment",
  "ApplicationModel",
  "ApplicationModel_Core",
  "Foundation_Collections",
] }
